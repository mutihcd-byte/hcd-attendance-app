<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#4D97B7"
  >

  <title>HCD Attendance PWA</title>

  <!-- PWA MANIFEST -->
  <link
    rel="manifest"
    href="./manifest.json"
  >

  <!-- Poppins Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link
  rel="stylesheet"
  href="./style.css?v=2026-07-23-05"
>
</head>

<body>

 <!-- COMPACT TOP TOOLBAR -->
<div
  id="kioskToolbar"
  class="kiosk-topbar"
>
  <span
    id="syncCounter"
    class="kiosk-pill kiosk-sync-status"
  >
    all synced
  </span>

  <button
    type="button"
    id="syncPendingBtn"
    class="kiosk-pill kiosk-action-button"
  >
    sync now
  </button>

  <button
    type="button"
    id="homeBtn"
    class="kiosk-pill kiosk-action-button"
  >
    home
  </button>

  <span
    id="connectionStatus"
    class="kiosk-pill kiosk-connection-status online"
  >
    online
  </span>
</div>


  <main class="container">

    <div id="cacheStatus"></div>

    <h1>HCD ATTENDANCE</h1>


    <!-- TRAINING SECTION -->
    <section id="trainingSection">

      <div class="row">

        <input
          type="text"
          id="trainingId"
          placeholder="TRAINING ID"
          autocomplete="off"
          oninput="
            this.value =
              this.value
                .toUpperCase()
                .replace(/\s/g,'')
          "
        >

        <button
          type="button"
          onclick="validateTraining()"
          id="trainingBtn"
        >
          VALIDATE
        </button>

      </div>

      <div id="trainingMsg"></div>

    </section>


    <!-- SELECTED TRAINING -->
    <div id="trainingTitleDisplay"></div>


    <!-- EMPLOYEE SECTION -->
    <section
      id="employeeSection"
      style="display:none;"
    >

      <div class="row">

        <input
          type="text"
          id="empId"
          maxlength="20"
          placeholder="EMPLOYEE ID"
          autocomplete="off"
          oninput="
            this.value =
              this.value
                .toUpperCase()
                .replace(/\s/g,'')
          "
        >

        <button
          type="button"
          onclick="validateEmployee()"
          id="empBtn"
        >
          SEARCH
        </button>

      </div>

      <div id="employeeMsg"></div>


      <!-- MANUAL EMPLOYEE ENTRY -->
      <section
        id="manualEntry"
        class="manual-entry-card"
        style="display:none;"
      >

        <div class="manual-entry-heading">
          Employee Not Found
        </div>

        <p class="manual-entry-description">
          Enter the employee’s information manually.
          The details will be saved on this device for
          future offline use.
        </p>

        <div class="manual-form-group">

          <label for="manualEmpId">
            Employee ID
          </label>

          <input
            type="text"
            id="manualEmpId"
            placeholder="EMPLOYEE ID"
            autocomplete="off"
            oninput="
              this.value =
                this.value
                  .toUpperCase()
                  .replace(/\s/g,'')
            "
          >

        </div>

        <div class="manual-form-group">

          <label for="manualEmpName">
            Full Name
          </label>

          <input
            type="text"
            id="manualEmpName"
            placeholder="FULL NAME"
            autocomplete="off"
          >

        </div>

        <div class="manual-form-group">

          <label for="manualEmpDept">
            Department / Branch
          </label>

          <input
            type="text"
            id="manualEmpDept"
            placeholder="DEPARTMENT OR BRANCH"
            autocomplete="off"
          >

        </div>

        <div class="manual-button-row">

          <button
            type="button"
            class="secondary-button"
            onclick="cancelManualEntry()"
          >
            CANCEL
          </button>

          <button
            type="button"
            onclick="saveManualEmployee()"
          >
            USE DETAILS
          </button>

        </div>

      </section>


      <!-- EMPLOYEE CARD -->
      <section
        id="employeeCard"
        class="employeeCard"
        style="display:none;"
      >

        <span
          id="manualEmployeeBadge"
          class="manual-badge"
          style="display:none;"
        >
          MANUAL ENTRY
        </span>

        <div
          class="employeeName"
          id="empName"
        ></div>

        <div class="employeeInfo">

          <div id="empDept"></div>

          <div id="empPos"></div>

        </div>

      </section>


      <!-- CONFIRM -->
      <button
        type="button"
        id="submitBtn"
        style="display:none;"
        onclick="submitAttendance()"
      >
        CONFIRM ATTENDANCE
      </button>


      <!-- SYNC -->
      <button
        type="button"
        id="syncBtn"
        onclick="syncToGoogleSheets(false)"
      >
        SYNC TO SHEETS
      </button>

    </section>

  </main>


  <!-- JS -->
    <!-- MAIN ATTENDANCE KIOSK APPLICATION -->
  <script
    src="./app.js?v=2026-07-23-05"
    onload="console.log('app.js loaded successfully')"
    onerror="console.error('ERROR: app.js failed to load')"
  ></script>


  <!-- SERVICE WORKER REGISTRATION -->
  <script>
  (() => {
    if (!("serviceWorker" in navigator)) {
      console.warn(
        "Service workers are not supported in this browser."
      );

      return;
    }

    let pageIsReloading = false;

    /*
      Reload once when a newly installed service worker
      takes control of the kiosk.
    */
    navigator.serviceWorker.addEventListener(
      "controllerchange",
      () => {
        if (pageIsReloading) {
          return;
        }

        pageIsReloading = true;

        console.log(
          "New kiosk version activated. Reloading once."
        );

        window.location.reload();
      }
    );

    window.addEventListener(
      "load",
      async () => {
        try {
          const registration =
            await navigator.serviceWorker.register(
              "./service-worker.js",
              {
                scope: "./",
                updateViaCache: "none"
              }
            );

          console.log(
            "Service worker registered:",
            registration.scope
          );

          /*
            Check immediately for a newer service worker.
          */
          await registration.update();

          /*
            Check once every hour when the kiosk stays open.
          */
          window.setInterval(
            () => {
              registration.update().catch(
                updateError => {
                  console.warn(
                    "Unable to check for updates:",
                    updateError
                  );
                }
              );
            },
            60 * 60 * 1000
          );

        } catch (registrationError) {
          console.error(
            "Service worker registration failed:",
            registrationError
          );
        }
      }
    );
  })();
  </script>


  <!-- TEMPORARY STARTUP CHECK -->
  <script>
  window.addEventListener("load", () => {
    console.log(
      "validateTraining:",
      typeof window.validateTraining
    );

    console.log(
      "validateEmployee:",
      typeof window.validateEmployee
    );

    console.log(
      "submitAttendance:",
      typeof window.submitAttendance
    );
  });
  </script>

</body>

</html>
