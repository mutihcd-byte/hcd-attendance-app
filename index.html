<!DOCTYPE html>
<html>

<head>

  <link rel="manifest" href="manifest.json">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HCD Attendance PWA</title>

  <!-- PWA MANIFEST -->
  <link rel="manifest" href="manifest.json">

  <!-- Poppins Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <div id="cacheStatus"></div>

    <h1>HCD ATTENDANCE</h1>

    <!-- TRAINING SECTION -->
    <div id="trainingSection">

      <div class="row">

        <input type="text"
               id="trainingId"
               placeholder="TRAINING ID"
               oninput="this.value=this.value.toUpperCase().replace(/\s/g,'')">

        <button onclick="validateTraining()" id="trainingBtn">
          VALIDATE
        </button>

      </div>

      <div id="trainingMsg"></div>
      
    </div>

    <div id="trainingTitleDisplay"></div>

    <!-- EMPLOYEE SECTION -->
    <div id="employeeSection" style="display:none;">

      <div class="row">

        <input type="text"
               id="empId"
               maxlength="5"
               placeholder="EMPLOYEE ID"
               oninput="this.value=this.value.toUpperCase().replace(/\s/g,'')">

        <button onclick="validateEmployee()" id="empBtn">
          SEARCH
        </button>


      </div>

      <div id="employeeMsg"></div>

      <!-- EMPLOYEE CARD -->
      <div id="employeeCard" class="employeeCard" style="display:none;">

        <div class="employeeName" id="empName"></div>

        <div class="employeeInfo">
          <div id="empDept"></div>
          <div id="empPos"></div>
        </div>

      </div>

            <button id="submitBtn"
              style="display:none;"
              onclick="submitAttendance()">
        CONFIRM ATTENDANCE
      </button>

      <button id="syncBtn" onclick="syncToGoogleSheets()">
        SYNC TO SHEETS
      </button>

      <div id="syncCounter"></div>

    </div>

  </div>

  <!-- JS -->
  <script src="app.js"></script>

</body>

</html>
